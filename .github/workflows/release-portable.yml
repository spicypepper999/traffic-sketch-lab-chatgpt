name: Publish Windows release

# Bumping package.json on main is sufficient to build and publish a new release.
# Manual runs may be used to retry a failed publication.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release-portable.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Determine version and skip existing release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid package version: $version" }
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. No new version to publish."
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Creating new release $tag"
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        if: steps.version.outputs.publish == 'true'
        with:
          go-version: '1.23'
      - name: Install and compile the browser game
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Firefox interaction tests
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          npx playwright install firefox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify private release access with CI token
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        working-directory: updater
        env:
          TSL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run . --check-github
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package portable game
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          npm run sync:launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location launcher
          go build -trimpath -ldflags="-s -w" -o TrafficSketchLab.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Compress-Archive -Path launcher/TrafficSketchLab.exe,launcher/README-Windows.txt -DestinationPath TrafficSketchLab-Windows.zip
      - name: Build reusable lightweight auto-updater
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        working-directory: updater
        run: |
          go build -trimpath -ldflags="-s -w" -o TrafficSketchLab-Updater.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish versioned GitHub release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$env:TAG" TrafficSketchLab-Windows.zip updater/TrafficSketchLab-Updater.exe --target "$env:GITHUB_SHA" --title "Traffic Sketch Lab $env:TAG" --generate-notes --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Firefox failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Release-Firefox-Diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
