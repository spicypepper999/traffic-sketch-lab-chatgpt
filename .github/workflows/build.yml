name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  firefox-ui:
    name: Firefox UI tests (Windows 11-compatible runner)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install firefox
      - run: npm run test:browser
      - name: Save screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-UI-Report-Windows
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run sync:launcher
      - name: Compile portable Windows executable
        working-directory: launcher
        run: go build -o TrafficSketchLab.exe .
        shell: pwsh
      - name: Package portable Windows build
        shell: pwsh
        run: Compress-Archive -Path launcher/TrafficSketchLab.exe,launcher/README-Windows.txt -DestinationPath TrafficSketchLab-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficSketchLab-Windows
          path: TrafficSketchLab-Windows.zip
