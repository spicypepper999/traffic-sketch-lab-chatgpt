name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run sync:launcher
      - name: Compile portable Windows executable
        working-directory: launcher
        run: go build -o TrafficSketchLab.exe .
        shell: pwsh
      - name: Package portable Windows build
        shell: pwsh
        run: Compress-Archive -Path launcher/TrafficSketchLab.exe,launcher/README-Windows.txt -DestinationPath TrafficSketchLab-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficSketchLab-Windows
          path: TrafficSketchLab-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TrafficSketchLab-Windows
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TrafficSketchLab-Windows.zip --title "Traffic Sketch Lab $GITHUB_REF_NAME" --generate-notes
